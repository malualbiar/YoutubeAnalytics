{% extends 'base.html' %}

{% block title %}Edit {{ artist.stage_name }} - YT Quid{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div>
        <h2 class="text-xl font-bold text-white tracking-tight">Edit Artist: {{ artist.stage_name }}</h2>
        <p class="text-xs text-zinc-400">Update artist metadata and status</p>
    </div>

    <div class="bg-dark-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300">Stage / Artist Name *</label>
                <input type="text" name="stage_name" value="{{ artist.stage_name }}" required class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Legal / Real Name</label>
                    <input type="text" name="name" value="{{ artist.name }}" class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Primary Genre</label>
                    <input type="text" name="genre" value="{{ artist.genre }}" class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300">Status</label>
                <select name="status" class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">
                    <option value="ACTIVE" {% if artist.status == 'ACTIVE' %}selected{% endif %}>Active</option>
                    <option value="INACTIVE" {% if artist.status == 'INACTIVE' %}selected{% endif %}>Inactive</option>
                </select>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300">Profile Image URL</label>
                <input type="url" name="profile_image" value="{{ artist.profile_image|default:'' }}" class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300">Artist Biography / Notes</label>
                <textarea name="description" rows="3" class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs text-white focus:border-emerald-500 focus:outline-none">{{ artist.description }}</textarea>
            </div>

            <div class="pt-3 flex justify-end gap-2.5">
                <a href="{% url 'artist_detail' artist.id %}" class="px-3.5 py-2 rounded-lg bg-zinc-800 text-xs font-medium text-zinc-300 hover:text-white">Cancel</a>
                <button type="submit" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-zinc-950 text-xs font-semibold rounded-lg shadow-sm">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
