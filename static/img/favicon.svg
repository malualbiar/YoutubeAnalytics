<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Play Shield / Wave Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="#06b6d4" opacity="0.25" filter="url(#softGlow)" />

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Analytics / Sound Equalizer Waveform Bars -->
  <g opacity="0.35">
    <rect x="96" y="260" width="16" height="80" rx="8" fill="#10b981" />
    <rect x="124" y="210" width="16" height="130" rx="8" fill="#06b6d4" />
    <rect x="152" y="170" width="16" height="170" rx="8" fill="#38bdf8" />
    <rect x="180" y="230" width="16" height="110" rx="8" fill="#818cf8" />
  </g>

  <!-- Central Dynamic YouTube Play Triangle & Studio Waveform -->
  <g filter="url(#glow)">
    <!-- Main Stylized Play Shape -->
    <path d="M 190 148 
             C 190 134, 206 125, 218 132 
             L 374 238 
             C 386 246, 386 266, 374 274 
             L 218 380 
             C 206 387, 190 378, 190 364 
             Z" 
          fill="url(#primaryGrad)" />

    <!-- Inner Sleek Cutout Arc / Studio Soundwave Ring -->
    <path d="M 230 190 
             L 330 256 
             L 230 322 
             Z" 
          fill="#090d16" 
          opacity="0.85" />

    <!-- Core Highlighting Center Play Icon -->
    <polygon points="244,212 312,256 244,300" fill="url(#accentGrad)" />

    <!-- Orbiting Studio Spark / Pulse Node -->
    <circle cx="360" cy="160" r="14" fill="#38bdf8" />
    <circle cx="360" cy="160" r="22" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- Bottom Analytics Metric Surge Arc -->
  <path d="M 100 390 Q 256 340, 412 390" stroke="url(#borderGrad)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7" />
  <circle cx="412" cy="390" r="6" fill="#34d399" />
</svg>
